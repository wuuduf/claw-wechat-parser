services:
  claw-parser:
    build: .
    image: claw-wechat-parser:latest
    container_name: claw-wechat-parser
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      CLAW_PARSER_STATE_DIR: /data
      CLAW_PARSER_MAX_MEDIA_SIZE_MB: ${CLAW_PARSER_MAX_MEDIA_SIZE_MB:-60}
      CLAW_PARSER_MAX_MEDIA_DURATION_S: ${CLAW_PARSER_MAX_MEDIA_DURATION_S:-600}
      CLAW_PARSER_CDN_UPLOAD_TIMEOUT_S: ${CLAW_PARSER_CDN_UPLOAD_TIMEOUT_S:-180}
      CLAW_PARSER_CDN_UPLOAD_RETRIES: ${CLAW_PARSER_CDN_UPLOAD_RETRIES:-3}
      CLAW_PARSER_DEBOUNCE_SECONDS: ${CLAW_PARSER_DEBOUNCE_SECONDS:-300}
      CLAW_PARSER_CACHE_MAX_GB: ${CLAW_PARSER_CACHE_MAX_GB:-4}
      CLAW_PARSER_BILIBILI_VIDEO_QUALITY: ${CLAW_PARSER_BILIBILI_VIDEO_QUALITY:-_720P}
      CLAW_PARSER_BILIBILI_VIDEO_CODECS: ${CLAW_PARSER_BILIBILI_VIDEO_CODECS:-AVC}
      CLAW_PARSER_BILIBILI_COOKIE: ${CLAW_PARSER_BILIBILI_COOKIE:-}
      CLAW_PARSER_DOUYIN_COOKIE: ${CLAW_PARSER_DOUYIN_COOKIE:-}
      CLAW_PARSER_XHS_COOKIE: ${CLAW_PARSER_XHS_COOKIE:-}
      CLAW_PARSER_INSTAGRAM_COOKIE: ${CLAW_PARSER_INSTAGRAM_COOKIE:-}
      CLAW_PARSER_YOUTUBE_COOKIE: ${CLAW_PARSER_YOUTUBE_COOKIE:-}
      CLAW_PARSER_TWITTER_COOKIE: ${CLAW_PARSER_TWITTER_COOKIE:-}
    volumes:
      - ./data:/data
    command: ["serve"]
    stop_grace_period: 30s
